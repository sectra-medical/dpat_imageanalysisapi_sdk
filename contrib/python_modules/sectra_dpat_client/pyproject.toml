[project]
name = "sectra-dpat-client"
version = "0.1.0"
description = "Client for Sectra DPAT server"
authors = [{ name = "Primaa, Sectra" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "14 days"
