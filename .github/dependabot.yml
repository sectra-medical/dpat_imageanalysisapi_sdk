version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/python_modules/sectra_dpat_downloader"
      - "/contrib/python_modules/sectra_dpat_client"
      - "/examples/python/ia_app_basic"
      - "/examples/python/ia_wholeslide"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/python_modules/sectra_dpat_downloader"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
